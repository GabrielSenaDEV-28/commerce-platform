spring.application.name=commerce-platform
shipping.melhor-envio.user-agent=${MELHOR_ENVIO_USER_AGENT:}
shipping.melhor-envio.client-id=${MELHOR_ENVIO_CLIENT_ID:}
shipping.melhor-envio.client-secret=${MELHOR_ENVIO_CLIENT_SECRET:}
shipping.melhor-envio.redirect-uri=${MELHOR_ENVIO_REDIRECT_URI:}
shipping.melhor-envio.encryption-key=${MELHOR_ENVIO_ENCRYPTION_KEY:}
storefront.base-domain=${STOREFRONT_BASE_DOMAIN:localhost}
server.forward-headers-strategy=none
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=${JWT_SECRET_BASE64}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
photos.s3.bucket=${PHOTO_S3_BUCKET:}
photos.s3.region=${PHOTO_S3_REGION:}
photos.s3.endpoint=${PHOTO_S3_ENDPOINT:}
photos.public-base-url=${PHOTO_PUBLIC_BASE_URL:}
auth.rate-limit.register=${AUTH_RATE_LIMIT_REGISTER:10}
auth.rate-limit.login=${AUTH_RATE_LIMIT_LOGIN:20}
auth.rate-limit.refresh=${AUTH_RATE_LIMIT_REFRESH:60}
auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:900}
