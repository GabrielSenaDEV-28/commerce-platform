spring.application.name=commerce-platform
shipping.melhor-envio.user-agent=${MELHOR_ENVIO_USER_AGENT:}
shipping.melhor-envio.client-id=${MELHOR_ENVIO_CLIENT_ID:}
shipping.melhor-envio.client-secret=${MELHOR_ENVIO_CLIENT_SECRET:}
shipping.melhor-envio.redirect-uri=${MELHOR_ENVIO_REDIRECT_URI:}
shipping.melhor-envio.encryption-key=${MELHOR_ENVIO_ENCRYPTION_KEY:}
storefront.base-domain=${STOREFRONT_BASE_DOMAIN:localhost}
server.forward-headers-strategy=none
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=${JWT_SECRET_BASE64}
