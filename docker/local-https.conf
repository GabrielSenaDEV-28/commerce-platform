map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8081;
    server_name localhost;

    location = /health {
        access_log off;
        return 200;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name localhost *.localhost;

    ssl_certificate /etc/nginx/local-https/server.crt;
    ssl_certificate_key /etc/nginx/local-https/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker's DNS must be resolved again after Watch recreates a container.
    resolver 127.0.0.11 valid=5s ipv6=off;

    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 4443;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    location / {
        set $frontend http://frontend:4200;
        proxy_pass $frontend;
        proxy_read_timeout 3600s;
    }
}
